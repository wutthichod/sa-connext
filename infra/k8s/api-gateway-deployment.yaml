apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-deployment
spec:
  # NET-1 presence and WebSocket connections are held in this process.
  # Multiple replicas require shared presence and per-gateway message delivery.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: connext-api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
