apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chat-service
  template:
    metadata:
      labels:
        app: chat-service
    spec:
      initContainers:
        - name: wait-for-mongo
          image: mongo:7
          command:
            - sh
            - -c
            - |
              until mongosh "$DATABASE_DSN" --quiet --eval 'quit(db.adminCommand("ping").ok ? 0 : 1)'; do
                echo "Waiting for MongoDB to be ready..."
                sleep 2
              done
              echo "MongoDB is ready!"
          env:
            - name: DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: DATABASE_DSN
      containers:
        - name: chat-service
          image: connext-chat-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
            - secretRef:
                name: mongodb-secret
          env:
            - name: CHAT_ADDR
              value: ":8082"
