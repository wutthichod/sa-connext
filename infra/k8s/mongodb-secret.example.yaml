apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
type: Opaque
stringData:
  # Local development defaults, matching docker-compose.yaml.
  MONGO_INITDB_ROOT_USERNAME: root
  MONGO_INITDB_ROOT_PASSWORD: rootpassword
  MONGO_APP_DB: chat-db
  MONGO_APP_USER: chatuser
  MONGO_APP_PASSWORD: chatpassword
  DATABASE_DSN: mongodb://chatuser:chatpassword@mongodb-svc:27017/chat-db?authSource=chat-db
